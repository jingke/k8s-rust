[package]
name = "remote-log-tui"
version = "0.1.0"
edition = "2021"
description = "Local TUI for Kubernetes pod logs (kube-rs) with tabbed pod picker"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
futures = "0.3.32"
k8s-openapi = { version = "0.24", features = ["v1_31"] }
kube = { version = "0.98", features = ["runtime"] }
ratatui = "0.29"
tokio = { version = "1.43", features = ["full"] }
